<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Érosion — Sandbox Hydrographique</title>
    <script
      src="https://cdn.tailwindcss.com?plugins=forms,container-queries"
      defer
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/core/variables.css" />
    <link rel="stylesheet" href="./css/core/base.css" />
    <link rel="stylesheet" href="./css/components/stage.css" />
    <link rel="stylesheet" href="./css/components/hud.css" />
    <link rel="stylesheet" href="./css/components/controls.css" />
    <link rel="stylesheet" href="./css/components/panel.css" />
    <link rel="stylesheet" href="./css/components/context-menu.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <script defer src="./js/core/config.js"></script>
    <script defer src="./js/core/math.js"></script>
    <script defer src="./js/core/state.js"></script>
    <script defer src="./js/simulation/terrain.js"></script>
    <script defer src="./js/simulation/simulation.js"></script>
    <script defer src="./js/simulation/drainage.js"></script>
    <script defer src="./js/simulation/particles.js"></script>
    <script defer src="./js/rendering/render.js"></script>
    <script defer src="./js/ui/ui.js"></script>
    <script defer src="./js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Canvas Area -->
      <div id="stage">
        <canvas id="c"></canvas>
        <div id="context-menu">
          <button id="ctx-add-source" style="display: flex">
            <span class="material-symbols-outlined" style="font-size: 16px"
              >water_drop</span
            >
            Ajouter une source d'eau
          </button>
          <button id="ctx-toggle-source" style="display: none">
            <span class="material-symbols-outlined" style="font-size: 16px"
              >toggle_on</span
            >
            <span class="context-menu-label">Désactiver la source</span>
          </button>
          <button id="ctx-delete-source" style="display: none">
            <span class="material-symbols-outlined" style="font-size: 16px"
              >delete</span
            >
            Supprimer
          </button>
        </div>
        <div id="hud">
          Mode: <b class="mode" id="modeLbl">Simulation</b><br />
          <span
            class="material-symbols-outlined"
            style="font-size: 12px; vertical-align: middle; margin-right: 4px"
            >speed</span
          >
          <b id="fps">--</b> fps · cible <b id="tgtMult">×1</b> · réel
          <b id="realMult">×1</b><br />
          <span
            class="material-symbols-outlined"
            style="font-size: 12px; vertical-align: middle; margin-right: 4px"
            >schedule</span
          >
          <b id="tcount">0</b> pas · <b id="tsim">0.0</b>s
        </div>
      </div>

      <!-- Bottom Control Bar -->
      <div id="bottom-bar">
        <button class="ctrl-btn" id="pause" title="Pause / Reprendre">
          <span class="material-symbols-outlined" id="pauseIcon">pause</span>
        </button>
        <div class="speed-ctrl">
          <span
            class="material-symbols-outlined"
            style="color: var(--text-muted); font-size: 16px"
            >slow_motion_video</span
          >
          <input id="speed" max="8" min="0" step="1" type="range" value="0" />
          <span
            id="speedLbl"
            style="
              font-family: var(--font-mono);
              font-size: 12px;
              color: var(--accent);
              width: 24px;
            "
            >×1</span
          >
        </div>
        <button class="ctrl-btn" id="regen" title="Générer nouveau terrain">
          <span class="material-symbols-outlined">refresh</span>
        </button>
        <button
          class="ctrl-btn"
          id="clearSrc"
          title="Effacer toutes les sources"
        >
          <span class="material-symbols-outlined">delete_sweep</span>
        </button>
      </div>

      <!-- Languette pour mobile -->
      <div id="panel-tab" title="Ouvrir les réglages">
        <span class="material-symbols-outlined" style="font-size: 18px"
          >chevron_left</span
        >
      </div>

      <!-- Side Settings Panel -->
      <div id="side-panel">
        <button id="close-panel" title="Fermer les réglages">
          <span class="material-symbols-outlined" style="font-size: 18px"
            >close</span
          >
        </button>
        <div class="panel-header">
          <h1>Sandbox Hydrographique</h1>
          <p class="desc">
            Modèle Mei, Decaudin &amp; Hu. Clic sur le sable pour ajouter une
            source d'eau.
          </p>
        </div>
        <div class="segmented modes">
          <button class="on" data-m="composite">Simulation</button>
          <button data-m="contribution">Analyse Terrain (D8)</button>
        </div>

        <!-- Divider 1 : Toujours visible -->
        <div class="hr"></div>

        <div id="layersBox">
          <div class="section-title">Couches Visuelles</div>
          <div class="layer-group">
            <div class="layer-group-title" data-group="layers-terrain">
              <span class="material-symbols-outlined" style="font-size: 14px"
                >terrain</span
              >
              Terrain
            </div>
            <div class="layer-list" id="layers-terrain"></div>
          </div>
          <div class="layer-group">
            <div class="layer-group-title" data-group="layers-water">
              <span class="material-symbols-outlined" style="font-size: 14px"
                >water</span
              >
              Eau &amp; Dynamique
            </div>
            <div class="layer-list" id="layers-water"></div>
          </div>
        </div>

        <!-- Divider 2 : Visible uniquement en mode composite -->
        <div class="hr" id="divider-bottom"></div>

        <div class="section-title">
          Sources Actives (<span id="srcCount">0</span>)
        </div>
        <div id="sources"></div>
      </div>
    </div>
  </body>
</html>
